[package]
name = "arpg-sim"
version.workspace = true
edition.workspace = true
build = "build.rs"

# Depends on the vocabulary, not on the renderer. `arpg-gfx` is absent on
# purpose: the simulation describes itself in `Instance`s and never learns how
# they are drawn.
[dependencies]
arpg-core.workspace = true
glam.workspace = true
# The game vocabulary's written form. `Template`, `Condition` and `SourceSpec`
# deserialise here so that a scenario `.ron` and the harness parser derive from
# one definition instead of each keeping a copy of the axes.
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
