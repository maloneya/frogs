[workspace]
members = ["crates/core", "crates/assets", "crates/gfx", "crates/sim", "crates/game", "crates/content", "crates/authoring", "crates/app", "crates/scenario"]
resolver = "3"

# So a bare `cargo run` still means "run the game".
default-members = ["crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
arpg-core = { path = "crates/core" }
arpg-assets = { path = "crates/assets" }
arpg-gfx = { path = "crates/gfx" }
arpg-sim = { path = "crates/sim" }
arpg-game = { path = "crates/game" }
arpg-content = { path = "crates/content" }
arpg-authoring = { path = "crates/authoring" }

bytemuck = { version = "1.25", features = ["derive"] }
env_logger = "0.11"
# Glyph rasterization only; atlas and layout remain handwritten.
fontdue = "0.9"
glam = "0.33"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
log = "0.4"
kira = { version = "0.12.4", default-features = false, features = ["cpal", "wav", "pcm"] }
png = "0.18.1"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"
# Manifest parsing for build-time architecture guards; never a runtime dependency.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

# Exceptions require #[expect(lint, reason = "...")].
[workspace.lints.rust]
unsafe_code = "deny"      # deny rather than forbid: the allocation counter will need one opt-out
missing_docs = "warn"

unreachable_pub = "deny"
unfulfilled_lint_expectations = "deny"

# Checked by the verification runner’s rustdoc step.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"     # forces `log`, which keeps the frame path off stdout
print_stderr = "deny"

# Keep exceptions accountable and mutation authority no wider than necessary.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
needless_pass_by_ref_mut = "deny"
rest_pat_in_fully_bound_structs = "deny"
redundant_clone = "deny"

# Only crates with a clippy.toml prohibition list restrict these APIs.
disallowed_methods = "deny"
disallowed_types = "deny"

# Optimize dependencies while preserving debug builds of workspace crates.
[profile.dev.package."*"]
opt-level = 3

# Keep headless scenarios fast; debug assertions and overflow checks remain enabled.
[profile.dev.package.arpg-sim]
opt-level = 3
